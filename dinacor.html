<!DOCTYPE html>
<html dir="rtl" lang="fa">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🐍 بازی مار</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            direction: rtl;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 30px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: white;
            padding: 0 10px;
        }

        .score-board {
            display: flex;
            gap: 30px;
            font-size: 20px;
            background: rgba(0, 0, 0, 0.3);
            padding: 12px 25px;
            border-radius: 15px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .score-board span {
            color: #00d2ff;
            font-weight: bold;
            font-size: 24px;
        }

        .high-score {
            color: #f7971e !important;
        }

        canvas {
            display: block;
            margin: 0 auto;
            border-radius: 20px;
            background: #1a1a2e;
            box-shadow: inset 0 0 50px rgba(0, 0, 0, 0.5);
            border: 2px solid rgba(255, 255, 255, 0.1);
            width: 500px;
            height: 500px;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            background: linear-gradient(135deg, #00d2ff, #3a7bd5);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 12px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0, 210, 255, 0.3);
            font-family: inherit;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 210, 255, 0.5);
        }

        .btn:active {
            transform: translateY(0px);
        }

        .btn-danger {
            background: linear-gradient(135deg, #f7971e, #ffd200);
            box-shadow: 0 5px 15px rgba(247, 151, 30, 0.3);
        }

        .btn-danger:hover {
            box-shadow: 0 8px 25px rgba(247, 151, 30, 0.5);
        }

        .mobile-controls {
            display: none;
            grid-template-columns: repeat(3, 70px);
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .mobile-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            border-radius: 15px;
            padding: 15px;
            font-size: 28px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(5px);
        }

        .mobile-btn:active {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(0.9);
        }

        .mobile-btn.empty {
            visibility: hidden;
        }

        .status {
            color: rgba(255, 255, 255, 0.6);
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        /* موبایل */
        @media (max-width: 600px) {
            .container {
                padding: 15px;
                width: 100%;
                border-radius: 15px;
            }

            canvas {
                width: 100%;
                height: auto;
                aspect-ratio: 1/1;
            }

            .score-board {
                font-size: 14px;
                padding: 8px 15px;
                gap: 15px;
            }

            .score-board span {
                font-size: 18px;
            }

            .header {
                flex-direction: column;
                gap: 10px;
            }

            .controls .btn {
                padding: 8px 20px;
                font-size: 14px;
            }

            .mobile-controls {
                display: grid;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- هدر -->
        <div class="header">
            <h1 style="color: white; font-size: 24px;">🐍 مار</h1>
            <div class="score-board">
                <div>🍎 امتیاز: <span id="score">0</span></div>
                <div>🏆 بهترین: <span class="high-score" id="highScore">0</span></div>
            </div>
        </div>

        <!-- بوم بازی -->
        <canvas id="gameCanvas" width="500" height="500"></canvas>

        <!-- دکمه‌ها -->
        <div class="controls">
            <button class="btn" id="startBtn">▶ شروع</button>
            <button class="btn btn-danger" id="pauseBtn">⏸ توقف</button>
            <button class="btn" id="restartBtn">🔄 دوباره</button>
        </div>

        <!-- کنترل موبایل -->
        <div class="mobile-controls" id="mobileControls">
            <div class="mobile-btn empty"></div>
            <div class="mobile-btn" data-dir="up">⬆</div>
            <div class="mobile-btn empty"></div>
            <div class="mobile-btn" data-dir="left">⬅</div>
            <div class="mobile-btn" data-dir="down">⬇</div>
            <div class="mobile-btn" data-dir="right">➡</div>
        </div>

        <div class="status" id="status">⌨️ با کلیدهای جهت‌دار حرکت کن</div>
    </div>

    <script>
        // ============================================
        // تنظیمات اولیه
        // ============================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const statusElement = document.getElementById('status');

        const SIZE = 20; // اندازه هر خانه
        const COLS = 25; // 500/20
        const ROWS = 25;

        // ============================================
        // متغیرهای بازی
        // ============================================
        let snake = [
            { x: 12, y: 12 },
            { x: 11, y: 12 },
            { x: 10, y: 12 },
            { x: 9, y: 12 }
        ];
        let food = { x: 15, y: 10 };
        let direction = 'right';
        let nextDirection = 'right';
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameRunning = false;
        let gamePaused = false;
        let gameInterval = null;
        let speed = 150; // میلی‌ثانیه
        let animationFrame = null;

        highScoreElement.textContent = highScore;

        // ============================================
        // توابع اصلی
        // ============================================

        // تولید غذا در جای تصادفی
        function generateFood() {
            let newFood;
            let attempts = 0;
            do {
                newFood = {
                    x: Math.floor(Math.random() * COLS),
                    y: Math.floor(Math.random() * ROWS)
                };
                attempts++;
            } while (
                (snake.some(segment => segment.x === newFood.x && segment.y === newFood.y) ||
                isFoodOnSnake(newFood)) &&
                attempts < 100
            );
            food = newFood;
        }

        function isFoodOnSnake(foodPos) {
            return snake.some(segment => segment.x === foodPos.x && segment.y === foodPos.y);
        }

        // حرکت مار
        function moveSnake() {
            if (gamePaused || !gameRunning) return false;

            // اعمال جهت جدید
            direction = nextDirection;

            // محاسبه سر جدید
            const head = { ...snake[0] };
            switch (direction) {
                case 'right':
                    head.x++;
                    break;
                case 'left':
                    head.x--;
                    break;
                case 'up':
                    head.y--;
                    break;
                case 'down':
                    head.y++;
                    break;
            }

            // برخورد با دیوار
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                gameOver();
                return false;
            }

            // برخورد با خودش
            if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
                gameOver();
                return false;
            }

            // اضافه کردن سر جدید
            snake.unshift(head);

            // چک کردن خوردن غذا
            if (head.x === food.x && head.y === food.y) {
                score++;
                scoreElement.textContent = score;

                // رکورد جدید
                if (score > highScore) {
                    highScore = score;
                    localStorage.setItem('snakeHighScore', highScore);
                    highScoreElement.textContent = highScore;
                }

                // تولید غذای جدید
                generateFood();

                // افزایش سرعت
                if (speed > 80) {
                    speed -= 2;
                    clearInterval(gameInterval);
                    gameInterval = setInterval(gameLoop, speed);
                }

                return true;
            }

            // حذف دم
            snake.pop();
            return true;
        }

        // ============================================
        // رسم
        // ============================================
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // رسم شبکه (اختیاری)
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * SIZE, 0);
                ctx.lineTo(i * SIZE, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * SIZE);
                ctx.lineTo(canvas.width, i * SIZE);
                ctx.stroke();
            }

            // رسم مار
            snake.forEach((segment, index) => {
                const gradient = ctx.createRadialGradient(
                    segment.x * SIZE + SIZE / 2,
                    segment.y * SIZE + SIZE / 2,
                    2,
                    segment.x * SIZE + SIZE / 2,
                    segment.y * SIZE + SIZE / 2,
                    SIZE / 2
                );

                const progress = index / snake.length;
                const r = Math.floor(0 + progress * 0);
                const g = Math.floor(200 - progress * 100);
                const b = Math.floor(80 + progress * 100);

                if (index === 0) {
                    // سر مار - افکت خاص
                    gradient.addColorStop(0, '#00ff88');
                    gradient.addColorStop(1, '#00cc66');
                } else {
                    gradient.addColorStop(0, `rgb(${r + 50}, ${g + 50}, ${b})`);
                    gradient.addColorStop(1, `rgb(${r}, ${g}, ${b})`);
                }

                ctx.fillStyle = gradient;
                ctx.shadowColor = index === 0 ? 'rgba(0, 255, 136, 0.5)' : 'rgba(0, 200, 100, 0.2)';
                ctx.shadowBlur = index === 0 ? 20 : 10;
                ctx.fillRect(segment.x * SIZE + 1, segment.y * SIZE + 1, SIZE - 2, SIZE - 2);
                ctx.shadowBlur = 0;

                // چشم‌های مار
                if (index === 0) {
                    ctx.fillStyle = 'white';
                    let eye1X, eye1Y, eye2X, eye2Y;
                    const offset = 5;
                    const eyeSize = 3;

                    switch (direction) {
                        case 'right':
                            eye1X = segment.x * SIZE + SIZE - 6;
                            eye1Y = segment.y * SIZE + 5;
                            eye2X = segment.x * SIZE + SIZE - 6;
                            eye2Y = segment.y * SIZE + SIZE - 5;
                            break;
                        case 'left':
                            eye1X = segment.x * SIZE + 6;
                            eye1Y = segment.y * SIZE + 5;
                            eye2X = segment.x * SIZE + 6;
                            eye2Y = segment.y * SIZE + SIZE - 5;
                            break;
                        case 'up':
                            eye1X = segment.x * SIZE + 5;
                            eye1Y = segment.y * SIZE + 6;
                            eye2X = segment.x * SIZE + SIZE - 5;
                            eye2Y = segment.y * SIZE + 6;
                            break;
                        case 'down':
                            eye1X = segment.x * SIZE + 5;
                            eye1Y = segment.y * SIZE + SIZE - 6;
                            eye2X = segment.x * SIZE + SIZE - 5;
                            eye2Y = segment.y * SIZE + SIZE - 6;
                            break;
                    }

                    ctx.beginPath();
                    ctx.arc(eye1X, eye1Y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eye2X, eye2Y, eyeSize, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = 'black';
                    ctx.beginPath();
                    ctx.arc(eye1X + (direction === 'right' ? 2 : direction === 'left' ? -2 : 0),
                        eye1Y + (direction === 'down' ? 2 : direction === 'up' ? -2 : 0),
                        1.5, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.beginPath();
                    ctx.arc(eye2X + (direction === 'right' ? 2 : direction === 'left' ? -2 : 0),
                        eye2Y + (direction === 'down' ? 2 : direction === 'up' ? -2 : 0),
                        1.5, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // رسم غذا با افکت چشمک‌زن
            const pulse = Math.sin(Date.now() / 300) * 3 + 7;
            const gradient = ctx.createRadialGradient(
                food.x * SIZE + SIZE / 2,
                food.y * SIZE + SIZE / 2,
                2,
                food.x * SIZE + SIZE / 2,
                food.y * SIZE + SIZE / 2,
                SIZE / 2 + 2
            );
            gradient.addColorStop(0, '#ff6b6b');
            gradient.addColorStop(0.7, '#ee5a24');
            gradient.addColorStop(1, '#c0392b');

            ctx.shadowColor = 'rgba(255, 107, 107, 0.6)';
            ctx.shadowBlur = 25;
            ctx.fillStyle = gradient;
            ctx.beginPath();
            ctx.arc(food.x * SIZE + SIZE / 2, food.y * SIZE + SIZE / 2, SIZE / 2 - 2, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // برگ غذا
            ctx.fillStyle = '#27ae60';
            ctx.beginPath();
            ctx.ellipse(
                food.x * SIZE + SIZE / 2 + 6,
                food.y * SIZE + SIZE / 2 - 8,
                4, 6,
                0.5, 0, Math.PI * 2
            );
            ctx.fill();
        }

        // ============================================
        // حلقه بازی
        // ============================================
        function gameLoop() {
            if (!gameRunning || gamePaused) {
                draw();
                return;
            }

            const moved = moveSnake();
            draw();

            if (!moved) {
                // gameOver قبلاً صدا زده شده
            }
        }

        // ============================================
        // کنترل‌های بازی
        // ============================================
        function startGame() {
            if (gameRunning && !gamePaused) return;

            if (!gameRunning) {
                resetGame();
                gameRunning = true;
                gamePaused = false;
                gameInterval = setInterval(gameLoop, speed);
                statusElement.textContent = '🎮 در حال بازی...';
                document.getElementById('startBtn').textContent = '▶ ادامه';
            } else if (gamePaused) {
                gamePaused = false;
                gameInterval = setInterval(gameLoop, speed);
                statusElement.textContent = '🎮 در حال بازی...';
                document.getElementById('startBtn').textContent = '▶ ادامه';
            }
        }

        function pauseGame() {
            if (!gameRunning) return;
            gamePaused = !gamePaused;
            if (gamePaused) {
                clearInterval(gameInterval);
                statusElement.textContent = '⏸ مکث';
                document.getElementById('startBtn').textContent = '▶ ادامه';
            } else {
                startGame();
            }
        }

        function resetGame() {
            clearInterval(gameInterval);
            gameRunning = false;
            gamePaused = false;

            snake = [
                { x: 12, y: 12 },
                { x: 11, y: 12 },
                { x: 10, y: 12 },
                { x: 9, y: 12 }
            ];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            speed = 150;
            scoreElement.textContent = '0';
            generateFood();
            draw();
            statusElement.textContent = '🔄 بازی ریست شد';
            document.getElementById('startBtn').textContent = '▶ شروع';

            // غذا رو طوری تولید کن که روی مار نباشه
            generateFood();
        }

        function gameOver() {
            clearInterval(gameInterval);
            gameRunning = false;
            statusElement.textContent = '💀 بازی تمام شد! دوباره شروع کن';
            document.getElementById('startBtn').textContent = '▶ شروع';

            // نمایش افکت game over
            ctx.fillStyle = 'rgba(0, 0, 0, 0.6)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ff6b6b';
            ctx.font = 'bold 48px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('💀', canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillStyle = 'white';
            ctx.font = '24px Arial';
            ctx.fillText('بازی تمام شد!', canvas.width / 2, canvas.height / 2 + 40);
        }

        // ============================================
        // کنترل با کیبورد
        // ============================================
        document.addEventListener('keydown', (e) => {
            const key = e.key;
            e.preventDefault();

            // کلیدهای Space برای شروع/مکث
            if (key === ' ' || key === 'Space') {
                if (!gameRunning) {
                    startGame();
                } else {
                    pauseGame();
                }
                return;
            }

            // کلیدهای جهت‌دار
            const opposite = {
                'ArrowUp': 'down',
                'ArrowDown': 'up',
                'ArrowLeft': 'right',
                'ArrowRight': 'left'
            };

            const dirMap = {
                'ArrowUp': 'up',
                'ArrowDown': 'down',
                'ArrowLeft': 'left',
                'ArrowRight': 'right'
            };

            if (dirMap[key] && dirMap[key] !== opposite[key] && dirMap[key] !== direction) {
                nextDirection = dirMap[key];
                // اگه بازی شروع نشده بود، شروع کن
                if (!gameRunning) {
                    startGame();
                }
            }
        });

        // ============================================
        // کنترل موبایل
        // ============================================
        document.querySelectorAll('.mobile-btn[data-dir]').forEach(btn => {
            btn.addEventListener('touchstart', (e) => {
                e.preventDefault();
                const dir = btn.dataset.dir;
                const opposite = {
                    'up': 'down',
                    'down': 'up',
                    'left': 'right',
                    'right': 'left'
                };
                if (dir !== opposite[dir] && dir !== direction) {
                    nextDirection = dir;
                    if (!gameRunning) {
                        startGame();
                    }
                }
            });

            btn.addEventListener('mousedown', (e) => {
                const dir = btn.dataset.dir;
                const opposite = {
                    'up': 'down',
                    'down': 'up',
                    'left': 'right',
                    'right': 'left'
                };
                if (dir !== opposite[dir] && dir !== direction) {
                    nextDirection = dir;
                    if (!gameRunning) {
                        startGame();
                    }
                }
            });
        });

        // ============================================
        // دکمه‌ها
        // ============================================
        document.getElementById('startBtn').addEventListener('click', startGame);
        document.getElementById('pauseBtn').addEventListener('click', pauseGame);
        document.getElementById('restartBtn').addEventListener('click', resetGame);

        // ============================================
        // شروع اولیه
        // ============================================
        generateFood();
        draw();
        statusElement.textContent = '⌨️ Space برای شروع، جهت‌ها برای حرکت';

        // انیمیشن چشمک‌زن غذا
        function animate() {
            if (!gameRunning || gamePaused) {
                draw();
            }
            requestAnimationFrame(animate);
        }
        animate();

        console.log('🐍 بازی مار آماده است!');
        console.log('🎮 کلیدها: Space = شروع/مکث، جهت‌ها = حرکت');
        console.log('📱 گوشی: دکمه‌های پایین صفحه');
    </script>

</body>
</html>
