<!DOCTYPE html>
<html>
<head>
    <title>بازی‌های من</title>
    <style>
        body {
            background: #0a0a23;
            color: white;
            font-family: Arial;
            text-align: center;
            padding: 50px;
        }
        .game-list {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .game-card {
            background: #1a1a3e;
            padding: 30px;
            border-radius: 15px;
            text-decoration: none;
            color: white;
            width: 200px;
            border: 2px solid #e94560;
            transition: 0.3s;
        }
        .game-card:hover {
            transform: scale(1.05);
            background: #2a2a5e;
        }
        .game-card h2 {
            color: #e94560;
        }
    </style>
</head>
<body>
    <h1>🎮 بازی‌های من</h1>
    <p>با HTML، CSS و جاوااسکریپت ساخته شده</p>
    <div class="game-list">
        <a href="games/توپ-بگیر/index.html" class="game-card">
            <h2>🎯 توپ رو بگیر!</h2>
            <p>روی توپ کلیک کن تا امتیاز بگیری</p>
        </a>
        <a href="games/دایناسور/index.html" class="game-card">
            <h2>🦕 دایناسور</h2>
            <p>با Space بپر و از موانع رد شو</p>
        </a>
    </div>
</body>
</html>
